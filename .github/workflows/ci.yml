name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-tests:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
      # Parallel Swift Testing deadlocks on the virtualized runners
      # (cooperative-pool starvation inside ImageIO); serial takes ~12s.
      - name: Test
        run: swift test --no-parallel

  ios-simulator-tests:
    name: Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Discover a simulator and run tests
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator UDID: $UDID"
          xcodebuild test \
            -scheme WICompress-Package \
            -destination "id=$UDID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

  platform-builds:
    name: Build (${{ matrix.platform }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [tvOS, watchOS, visionOS]
    steps:
      - uses: actions/checkout@v5
      - name: Build for ${{ matrix.platform }} Simulator
        run: |
          xcodebuild build \
            -scheme WICompress \
            -destination "generic/platform=${{ matrix.platform }} Simulator" \
            CODE_SIGNING_ALLOWED=NO
